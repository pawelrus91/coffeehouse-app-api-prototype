services:
  postgres_db:
    image: postgres:18.6
    env_file: .env
    ports:
      - "8001:5432"
    restart: always
  
  mono_django:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - postgres_db
    restart: always
